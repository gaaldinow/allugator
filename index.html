 Esteves\", \"url\": \"\"}, {\"name\": \"Paulo Rocha\", \"url\": \"\"}], \"AL\": [{\"name\": \"Elaine Queiroz\", \"url\": \"\"}, {\"name\": \"Nicolas Esteves\", \"url\": \"\"}, {\"name\": \"Julia Borges Freitas\", \"url\": \"\"}, {\"name\": \"Igor Melo\", \"url\": \"\"}, {\"name\": \"Paulo Moura\", \"url\": \"\"}], \"SE\": [{\"name\": \"Jessica Freitas Xavier\", \"url\": \"\"}, {\"name\": \"Felipe Barbosa Xavier\", \"url\": \"\"}, {\"name\": \"Henrique Rocha\", \"url\": \"\"}, {\"name\": \"Kleber Machado\", \"url\": \"\"}, {\"name\": \"Elaine Batista Campos\", \"url\": \"\"}]\n  };\n  // =============================================================================\n  function lvl(n){return !n?0:n<=5?1:n<=7?2:n<=9?3:n<=20?4:5}\n  var paths=document.querySelectorAll('#unboxings .ub-st'),svg=document.querySelector('#unboxings .ub-map svg');\n  var sum=0;for(var k in DATA)sum+=DATA[k];document.getElementById('ubTotal').textContent=sum;\n  paths.forEach(function(p){\n    var uf=p.getAttribute('data-uf');p.classList.add('l'+lvl(DATA[uf]||0));\n    p.setAttribute('tabindex','0');p.setAttribute('role','button');p.setAttribute('aria-label',NAMES[uf]);\n    p.addEventListener('click',function(){sel(uf)});\n    p.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(uf)}});\n  });\n  function sel(uf){\n    paths.forEach(function(p){p.classList.toggle('on',p.getAttribute('data-uf')===uf);if(p.getAttribute('data-uf')===uf)svg.appendChild(p)});\n    var n=DATA[uf]||0,v=VIDEOS[uf]||[];\n    document.getElementById('ubName').textContent=NAMES[uf];\n    document.getElementById('ubCount').textContent=n+(n===1?' vídeo':' vídeos');\n    var l=document.getElementById('ubList');\n    l.scrollTop=0;\n    l.innerHTML=v.length?v.map(function(x){\n      var inner='<div class=\"ub-ic\">'+YT+'<\/div><div class=\"ub-tx\"><b>'+x.name+'<\/b><span>YouTube<\/span><\/div>'+CH;\n      return x.url?'<a class=\"ub-item\" href=\"'+x.url+'\" target=\"_blank\" rel=\"noopener\">'+inner+'<\/a>':'<div class=\"ub-item\">'+inner+'<\/div>';\n    }).join(''):'<div class=\"ub-empty\">Os vídeos deste estado chegam em breve.<\/div>';\n  }\n  sel('SP');\n})();\n", "\n// HERO CAROUSEL\nconst track = document.getElementById('heroTrack');\nconst dots  = document.querySelectorAll('.dot');\nconst N     = 5;\nlet cur = 0, timer;\n\nfunction goSlide(n) {\n  cur = (n + N) % N;\n  track.style.transform = `translateX(-${cur * 100}%)`;\n  dots.forEach((d, i) => d.classList.toggle('active', i === cur));\n}\nfunction startAuto() { timer = setInterval(() => goSlide(cur + 1), 4500); }\nfunction stopAuto()  { clearInterval(timer); }\nstartAuto();\n\n// swipe\nlet sx = 0;\ntrack.addEventListener('touchstart', e => { sx = e.touches[0].clientX; stopAuto(); }, {passive:true});\ntrack.addEventListener('touchend',   e => {\n  const d = sx - e.changedTouches[0].clientX;\n  if (Math.abs(d) > 40) goSlide(d > 0 ? cur + 1 : cur - 1);\n  startAuto();\n}, {passive:true});\n\n// ── LOCALIZAÇÃO AUTOMÁTICA (CEP row) ──\nconst cepText  = document.getElementById('cepText');\nconst cepRow   = document.getElementById('cepRow');\nconst LOC_KEY  = 'allu_location_label';\nconst LOC_TIME = 'allu_location_time';\nconst LOC_TTL  = 24 * 60 * 60 * 1000; // 24h\n\nfunction setLocationLabel(label, persist = true) {\n  cepText.textContent = label;\n  if (persist) {\n    try {\n      localStorage.setItem(LOC_KEY, label);\n      localStorage.setItem(LOC_TIME, String(Date.now()));\n    } catch (e) {}\n  }\n}\n\nasync function reverseGeocode(lat, lon) {\n  const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`);\n  if (!res.ok) throw new Error('reverse geocode failed');\n  const data = await res.json();\n  // \"locality\" tende a ser mais granular (bairro/cidade real) que \"city\",\n  // que às vezes cai pra sede da região metropolitana mais próxima.\n  const place = data.locality || data.city || data.principalSubdivision || '';\n  const ufRaw = data.principalSubdivisionCode || '';\n  const uf = ufRaw.includes('-') ? ufRaw.split('-')[1] : ufRaw;\n  if (!place) throw new Error('no place');\n  return uf ? `Entregando em ${place} - ${uf}` : `Entregando em ${place}`;\n}\n\nasync function ipGeocode() {\n  const res = await fetch('https://ipapi.co/json/');\n  if (!res.ok) throw new Error('ip geocode failed');\n  const data = await res.json();\n  const city = data.city || '';\n  const uf = data.region_code || '';\n  if (!city) throw new Error('no city');\n  // deixa claro que é uma estimativa por IP (menos precisa que o GPS)\n  return uf ? `Entregando perto de ${city} - ${uf}` : `Entregando perto de ${city}`;\n}\n\nfunction getBrowserLocation(highAccuracy) {\n  return new Promise((resolve, reject) => {\n    if (!navigator.geolocation) return reject(new Error('no geolocation'));\n    navigator.geolocation.getCurrentPosition(\n      pos => resolve(pos.coords),\n      err => reject(err),\n      { enableHighAccuracy: highAccuracy, timeout: highAccuracy ? 10000 : 5000, maximumAge: 0 }\n    );\n  });\n}\n\nasync function detectLocation() {\n  // usa cache recente, se existir\n  try {\n    const cached = localStorage.getItem(LOC_KEY);\n    const cachedAt = Number(localStorage.getItem(LOC_TIME) || 0);\n    if (cached && (Date.now() - cachedAt) < LOC_TTL) {\n      cepText.textContent = cached;\n      return;\n    }\n  } catch (e) {}\n\n  // geolocalização por IP, direto — não pede permissão do navegador\n  try {\n    const label = await ipGeocode();\n    setLocationLabel(label);\n    return;\n  } catch (e) { /* segue pro fallback final */ }\n\n  // 4) fallback final: texto padrão\n  cepText.textContent = 'Informe CEP';\n}\n\ndetectLocation();\n\n// clique no campo permite digitar o CEP manualmente\ncepRow.addEventListener('click', async () => {\n  const input = prompt('Digite seu CEP:');\n  if (!input) return;\n  const cep = input.replace(/\\D/g, '');\n  if (cep.length !== 8) { alert('CEP inválido. Digite os 8 números do CEP.'); return; }\n\n  const previous = cepText.textContent;\n  cepText.textContent = 'Buscando...';\n  try {\n    const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);\n    const data = await res.json();\n    if (data.erro) throw new Error('CEP não encontrado');\n    const label = `Entregando em ${data.localidade} - ${data.uf}`;\n    setLocationLabel(label);\n  } catch (e) {\n    cepText.textContent = previous;\n    alert('Não foi possível localizar esse CEP.');\n  }\n});\n"]</script>
<script type="text/plain" id="js-cat">["\n// ── LOCALIZAÇÃO AUTOMÁTICA (CEP row) ──\nconst cepText  = document.getElementById('cepText');\nconst cepRow   = document.getElementById('cepRow');\nconst LOC_KEY  = 'allu_location_label';\nconst LOC_TIME = 'allu_location_time';\nconst LOC_TTL  = 24 * 60 * 60 * 1000; // 24h\n\nfunction setLocationLabel(label, persist = true) {\n  cepText.textContent = label;\n  if (persist) {\n    try {\n      localStorage.setItem(LOC_KEY, label);\n      localStorage.setItem(LOC_TIME, String(Date.now()));\n    } catch (e) {}\n  }\n}\n\nasync function reverseGeocode(lat, lon) {\n  const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`);\n  if (!res.ok) throw new Error('reverse geocode failed');\n  const data = await res.json();\n  // \"locality\" tende a ser mais granular (bairro/cidade real) que \"city\",\n  // que às vezes cai pra sede da região metropolitana mais próxima.\n  const place = data.locality || data.city || data.principalSubdivision || '';\n  const ufRaw = data.principalSubdivisionCode || '';\n  const uf = ufRaw.includes('-') ? ufRaw.split('-')[1] : ufRaw;\n  if (!place) throw new Error('no place');\n  return uf ? `Entregando em ${place} - ${uf}` : `Entregando em ${place}`;\n}\n\nasync function ipGeocode() {\n  const res = await fetch('https://ipapi.co/json/');\n  if (!res.ok) throw new Error('ip geocode failed');\n  const data = await res.json();\n  const city = data.city || '';\n  const uf = data.region_code || '';\n  if (!city) throw new Error('no city');\n  // deixa claro que é uma estimativa por IP (menos precisa que o GPS)\n  return uf ? `Entregando perto de ${city} - ${uf}` : `Entregando perto de ${city}`;\n}\n\nfunction getBrowserLocation(highAccuracy) {\n  return new Promise((resolve, reject) => {\n    if (!navigator.geolocation) return reject(new Error('no geolocation'));\n    navigator.geolocation.getCurrentPosition(\n      pos => resolve(pos.coords),\n      err => reject(err),\n      { enableHighAccuracy: highAccuracy, timeout: highAccuracy ? 10000 : 5000, maximumAge: 0 }\n    );\n  });\n}\n\nasync function detectLocation() {\n  // usa cache recente, se existir\n  try {\n    const cached = localStorage.getItem(LOC_KEY);\n    const cachedAt = Number(localStorage.getItem(LOC_TIME) || 0);\n    if (cached && (Date.now() - cachedAt) < LOC_TTL) {\n      cepText.textContent = cached;\n      return;\n    }\n  } catch (e) {}\n\n  // 1) tenta GPS/rede com alta precisão (posição sempre nova, nunca cacheada pelo SO)\n  try {\n    const { latitude, longitude } = await getBrowserLocation(true);\n    const label = await reverseGeocode(latitude, longitude);\n    setLocationLabel(label);\n    return;\n  } catch (e) { /* segue pra tentativa 2 */ }\n\n  // 2) tenta de novo com precisão padrão (mais rápido, funciona melhor em desktop)\n  try {\n    const { latitude, longitude } = await getBrowserLocation(false);\n    const label = await reverseGeocode(latitude, longitude);\n    setLocationLabel(label);\n    return;\n  } catch (e) { /* segue pro fallback por IP */ }\n\n  // 3) fallback: geolocalização por IP (aproximada, sem pedir permissão)\n  try {\n    const label = await ipGeocode();\n    setLocationLabel(label);\n    return;\n  } catch (e) { /* segue pro fallback final */ }\n\n  // 4) fallback final: texto padrão\n  cepText.textContent = 'Informe CEP';\n}\n\ndetectLocation();\n\n// clique no campo permite digitar o CEP manualmente\ncepRow.addEventListener('click', async () => {\n  const input = prompt('Digite seu CEP:');\n  if (!input) return;\n  const cep = input.replace(/\\D/g, '');\n  if (cep.length !== 8) { alert('CEP inválido. Digite os 8 números do CEP.'); return; }\n\n  const previous = cepText.textContent;\n  cepText.textContent = 'Buscando...';\n  try {\n    const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);\n    const data = await res.json();\n    if (data.erro) throw new Error('CEP não encontrado');\n    const label = `Entregando em ${data.localidade} - ${data.uf}`;\n    setLocationLabel(label);\n  } catch (e) {\n    cepText.textContent = previous;\n    alert('Não foi possível localizar esse CEP.');\n  }\n});\n"]</script>

rátis, incluso.", "t1": "R$ 73,90", "cents": 7390, "slug": "15"}}</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script>
/* ===== CONFIGURAÇÃO DO CHECKOUT =====
   mode: automático. Abrindo o arquivo no computador (file://) = 'mock' (simula o Pix, NENHUMA cobrança real).
         Publicado no site = 'live' (envia para /api/checkout, que gera o Pix real na Velani).
   Para forçar: troque a expressão por 'mock' ou 'live'.
   cardEnabled: false = só Pix (cartão aparece desativado). Para reativar o cartão: true + CARD_ENABLED=1 no servidor. */
window.CHECKOUT_CONFIG={ mode: (location.protocol==='file:' ? 'mock' : 'live'), apiBase:'/api', pixPollMs:5000, cardEnabled:false };
</script>
<script>
function mountProduct(P){
  const C=Object.assign({mode:'mock',apiBase:'/api',pixPollMs:4000,cardEnabled:false},window.CHECKOUT_CONFIG||{});
  const state={plan:'1',signature:'',cpf:'',idem:null};
  const views=document.querySelectorAll('.pg-prod .view'),steps=document.querySelectorAll('.pg-prod .step');
  let hist=['1'];
  const $=id=>document.getElementById(id);
  const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}).replace(/\u00a0/g,' ');
  const digits=v=>String(v||'').replace(/\D/g,'');

  function showView(name){
    views.forEach(v=>v.classList.toggle('active',v.dataset.view===name));
    const stepNum=name==='loading'?hist[hist.length-2]:name, cur=parseInt(stepNum);
    steps.forEach(s=>{const n=parseInt(s.dataset.step);s.classList.toggle('active',n===cur);s.classList.toggle('done',n<cur)});
    $('mobileCount').textContent='Passo '+cur+'/5';
    $('mobileFill').style.width=(cur/5*100)+'%';
    $('btnBack').textContent=(name==='1')?'← Voltar ao catálogo':'← Voltar';
  }
  function goTo(name,push){ if(push!==false)hist.push(name); showView(name); window.scrollTo({top:0,behavior:'smooth'}); }
  $('btnBack').addEventListener('click',()=>{
    if(hist.length>1){hist.pop();showView(hist[hist.length-1]);resetCheckoutView();window.scrollTo({top:0,behavior:'smooth'});}
    else location.hash='#/catalogo';
  });

  /* ---------- Passo 1: CPF ---------- */
  const cpfInput=$('cpf'),cpfHint=$('cpfHint'),btnCpf=$('btnCpf');
  function maskCPF(v){v=digits(v).slice(0,11);
    if(v.length>9)return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
    if(v.length>6)return v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
    if(v.length>3)return v.replace(/(\d{3})(\d{1,3})/,'$1.$2');return v;}
  function isValidCPF(raw){const c=digits(raw);if(c.length!==11)return false;if(/^(\d)\1{10}$/.test(c))return false;
    let s=0;for(let i=0;i<9;i++)s+=parseInt(c[i])*(10-i);let d1=(s*10)%11;if(d1===10)d1=0;if(d1!==parseInt(c[9]))return false;
    s=0;for(let i=0;i<10;i++)s+=parseInt(c[i])*(11-i);let d2=(s*10)%11;if(d2===10)d2=0;return d2===parseInt(c[10]);}
  cpfInput.addEventListener('input',e=>{
    e.target.value=maskCPF(e.target.value);
    const dg=digits(e.target.value);
    if(dg.length<11){cpfHint.textContent='Digite os 11 números do seu CPF.';cpfHint.className='hint';btnCpf.disabled=true;return;}
    if(isValidCPF(e.target.value)){cpfHint.textContent='Número válido.';cpfHint.className='hint ok';btnCpf.disabled=false;}
    else{cpfHint.textContent='CPF inválido — confira os números digitados.';cpfHint.className='hint err';btnCpf.disabled=true;}
  });
  btnCpf.addEventListener('click',()=>{
    state.cpf=cpfInput.value;
    goTo('loading');
    $('loadingTitle').textContent='Verificando o número informado…';
    $('loadingSub').textContent='Conferindo os dígitos verificadores do CPF.';
    setTimeout(()=>{hist.pop();goTo('2');},1400);
  });

  /* ---------- Passos 2–4 ---------- */
  $('btnProduct').addEventListener('click',()=>goTo('3'));
  $('btnPlan').addEventListener('click',()=>{
    $('planNameDoc').textContent='Opção 1 — 1ª parcela hoje, 2ª coberta pela allu, 3ª em 90 dias, frete grátis';
    $('planScheduleDoc').textContent=P.s1;
    goTo('4');
  });
  const sigInput=$('sigInput'),agreeBox=$('agreeBox'),btnSign=$('btnSign');
  $('sigDate').textContent=new Date().toLocaleDateString('pt-BR');
  const ready=()=>{btnSign.disabled=!(sigInput.value.trim().length>3&&agreeBox.checked);};
  sigInput.addEventListener('input',ready);agreeBox.addEventListener('change',ready);
  btnSign.addEventListener('click',()=>{
    state.signature=sigInput.value.trim();
    prepareCheckout();
    goTo('5');
  });

  /* ================= CHECKOUT ================= */
  const F=['Name','Phone','Email','Cep','Uf','Street','Number','District','City','CardNum','CardName','CardExp','CardCvv'];
  const el=n=>$('ck'+n);
  const UFS='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
  UFS.forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;el('Uf').appendChild(o);});
  const method=()=>document.querySelector('.pg-prod input[name=ckMethod]:checked').value;

  function prepareCheckout(){
    $('payerName').textContent=state.signature.split(' ')[0];
    el('Name').value=el('Name').value||state.signature;
    el('Cpf').value=state.cpf;
    $('ckSumName').textContent=P.prodLine;
    $('ckSumToday').textContent=P.t1;
    $('ckTest').hidden=C.mode!=='mock';
    syncMethod();
  }
  function resetCheckoutView(){
    if($('ckMain')) {
      ['ckProcessing','ckPix','ckDone','ckFail'].forEach(i=>$(i).hidden=true);
      $('ckMain').hidden=false;
    }
  }
  function syncMethod(){
    const m=method();
    document.querySelectorAll('.pg-prod .ck-method').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
    $('ckCardBox').hidden=m!=='card';
    $('ckPixNote').hidden=m!=='pix';
    $('ckPay').textContent=m==='pix'?'Gerar Pix de '+P.t1:'Pagar '+P.t1+' no cartão';
  }
  document.querySelectorAll('.pg-prod input[name=ckMethod]').forEach(r=>r.addEventListener('change',syncMethod));
  (function(){const r=document.querySelector('.pg-prod input[value=card]');r.disabled=!C.cardEnabled;r.closest('.ck-method').classList.toggle('off',!C.cardEnabled);})();
  syncMethod();

  /* máscaras */
  el('Phone').addEventListener('input',e=>{let v=digits(e.target.value).slice(0,11);
    e.target.value=v.length>10?v.replace(/(\d{2})(\d{5})(\d{1,4})/,'($1) $2-$3'):v.length>6?v.replace(/(\d{2})(\d{4})(\d{1,4})/,'($1) $2-$3'):v.length>2?v.replace(/(\d{2})(\d{1,5})/,'($1) $2'):v;});
  el('CardNum').addEventListener('input',e=>{e.target.value=digits(e.target.value).slice(0,19).replace(/(\d{4})(?=\d)/g,'$1 ');});
  el('CardExp').addEventListener('input',e=>{let v=digits(e.target.value).slice(0,4);e.target.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v;});
  el('CardCvv').addEventListener('input',e=>{e.target.value=digits(e.target.value).slice(0,4);});
  el('CardName').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
  el('Cep').addEventListener('input',e=>{
    let v=digits(e.target.value).slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;
    if(v.length===8)lookupCep(v);
  });
  async function lookupCep(cep){
    try{
      const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');const d=await r.json();
      if(d.erro)return;
      if(d.logradouro)el('Street').value=d.logradouro;
      if(d.bairro)el('District').value=d.bairro;
      if(d.localidade)el('City').value=d.localidade;
      if(d.uf)el('Uf').value=d.uf;
      ['Street','District','City','Uf','Cep'].forEach(n=>setErr(n,''));
      el('Number').focus();
    }catch(e){}
  }

  /* validação */
  function setErr(n,msg){const f=el(n).closest('.ck-field');f.classList.toggle('bad',!!msg);f.querySelector('.ck-err').textContent=msg||'';}
  const luhn=n=>{let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return n.length>=13&&s%10===0};
  function validate(){
    const e={},m=method();
    const name=el('Name').value.trim().replace(/\s+/g,' ');
    if(name.split(' ').filter(w=>w.length>1).length<2)e.Name='Informe seu nome completo.';
    const ph=digits(el('Phone').value);
    if(!(ph.length===10||ph.length===11)||+ph.slice(0,2)<11)e.Phone='Informe um celular válido com DDD.';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el('Email').value.trim()))e.Email='Informe um e-mail válido.';
    if(digits(el('Cep').value).length!==8)e.Cep='CEP inválido.';
    if(!el('Uf').value)e.Uf='Escolha.';
    if(el('Street').value.trim().length<3)e.Street='Informe a rua.';
    if(!el('Number').value.trim())e.Number='Informe o número.';
    if(el('District').value.trim().length<2)e.District='Informe o bairro.';
    if(el('City').value.trim().length<2)e.City='Informe a cidade.';
    if(m==='card'){
      if(!luhn(digits(el('CardNum').value)))e.CardNum='Número de cartão inválido.';
      if(el('CardName').value.trim().length<3)e.CardName='Informe o nome do cartão.';
      const ex=el('CardExp').value.match(/^(\d{2})\/(\d{2})$/);
      if(!ex||+ex[1]<1||+ex[1]>12||new Date(2000+ +ex[2],+ex[1],0,23,59)<new Date())e.CardExp='Validade inválida.';
      if(digits(el('CardCvv').value).length<3)e.CardCvv='CVV inválido.';
    }
    F.forEach(n=>setErr(n,e[n]));
    return e;
  }
  F.forEach(n=>el(n).addEventListener('input',()=>{setErr(n,'');$('ckAlert').hidden=true;}));

  function showAlert(msg){const a=$('ckAlert');a.textContent=msg||'';a.hidden=!msg;}
  const uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  function utm(){
    try{const q=new URLSearchParams(location.search),o=JSON.parse(sessionStorage.getItem('allu_utm')||'{}');
      ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','src','sck'].forEach(k=>{if(q.get(k))o[k]=q.get(k)});
      sessionStorage.setItem('allu_utm',JSON.stringify(o));return o;}catch(e){return{}}
  }

  /* ---- camada de API (live) e simulação (mock) ---- */
  async function api(path,opts){
    let r;
    try{r=await fetch(C.apiBase+path,opts);}catch(e){const er=new Error('Sem conexão com o servidor. Verifique sua internet e tente novamente.');er.network=true;throw er;}
    let d={};try{d=await r.json();}catch(e){}
    if(!r.ok){const er=new Error(d.error||'Não foi possível processar o pagamento. Tente novamente.');er.fields=d.fields;throw er;}
    return d;
  }
  const MOCK={orders:{}};
  function mockCreate(p){
    const id='TESTE-'+Date.now().toString(36).toUpperCase();
    MOCK.orders[id]={t:Date.now(),method:p.method};
    if(p.method==='card'){
      const n=digits(p.card.number);
      MOCK.orders[id].status=n.endsWith('0002')?'refused':'paid';
      return new Promise(r=>setTimeout(()=>r({orderId:id,status:MOCK.orders[id].status,method:'card',message:MOCK.orders[id].status==='refused'?'Cartão recusado pelo banco emissor (simulação).':undefined}),1500));
    }
    MOCK.orders[id].status='pending';
    const code='00020126580014br.gov.bcb.pix0136TESTE-0000-0000-0000-000000000000520400005303986540'+String(P.cents/100).replace('.','').padStart(5,'0')+'5802BR5905ALLU6009SAO PAULO62070503***6304TEST';
    return new Promise(r=>setTimeout(()=>r({orderId:id,status:'pending',method:'pix',pix:{copyPaste:code,qrImage:null,expiresAt:new Date(Date.now()+30*60000).toISOString()}}),1200));
  }
  function mockStatus(id){const o=MOCK.orders[id];return Promise.resolve({status:!o?'unknown':(o.status==='pending'&&Date.now()-o.t>8000?'paid':o.status)});}
  const createOrder=p=>C.mode==='mock'?mockCreate(p):api('/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  const getStatus=id=>C.mode==='mock'?mockStatus(id):api('/status?id='+encodeURIComponent(id));

  /* ---- envio ---- */
  let busy=false;
  $('ckForm').addEventListener('submit',async ev=>{
    ev.preventDefault();
    if(busy)return;
    showAlert('');
    const errs=validate();
    const first=F.find(n=>errs[n]);
    if(first){el(first).focus();showAlert('Confira os campos destacados.');return;}
    const m=method();
    const payload={
      idempotencyKey:state.idem||(state.idem=uuid()),
      product:P.slug,plan:'1',method:m,
      customer:{name:el('Name').value.trim().replace(/\s+/g,' '),cpf:digits(state.cpf),email:el('Email').value.trim().toLowerCase(),phone:digits(el('Phone').value)},
      address:{cep:digits(el('Cep').value),street:el('Street').value.trim(),number:el('Number').value.trim(),complement:el('Comp').value.trim(),district:el('District').value.trim(),city:el('City').value.trim(),uf:el('Uf').value},
      signature:state.signature,tracking:utm()
    };
    /* guarda o cliente p/ reaproveitar no upsell da /nf/ (gerar o Pix da regularização) */
    try{localStorage.setItem('allu_customer',JSON.stringify({name:payload.customer.name,cpf:payload.customer.cpf,email:payload.customer.email,phone:payload.customer.phone,tracking:payload.tracking}));}catch(e){}
    if(m==='card'){
      const ex=el('CardExp').value.split('/');
      payload.card={number:digits(el('CardNum').value),holder:el('CardName').value.trim(),expMonth:ex[0],expYear:'20'+ex[1],cvv:el('CardCvv').value};
      if(typeof C.tokenizeCard==='function'){
        try{const tk=await C.tokenizeCard(payload.card);payload.card={token:tk};}
        catch(e){showAlert('Não foi possível validar o cartão. Confira os dados.');return;}
      }
    }
    busy=true;$('ckPay').disabled=true;$('ckMain').hidden=true;$('ckProcessing').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
    try{
      const res=await createOrder(payload);
      $('ckProcessing').hidden=true;
      if(res.status==='paid')showDone(res);
      else if(res.status==='pending'&&res.pix)showPix(res);
      else showFail(res.message||'O pagamento não foi aprovado. Tente outro cartão ou pague com Pix.');
    }catch(err){
      $('ckProcessing').hidden=true;$('ckMain').hidden=false;
      if(err.fields)F.forEach(n=>{const k=n.charAt(0).toLowerCase()+n.slice(1);if(err.fields[k])setErr(n,err.fields[k]);});
      showAlert(err.fields&&err.fields.card?err.fields.card:err.message);
    }finally{busy=false;$('ckPay').disabled=false;}
  });

  function showDone(res){
    $('ckPix').hidden=true;$('ckProcessing').hidden=true;$('ckMain').hidden=true;$('ckFail').hidden=true;
    $('ckDoneName').textContent=el('Name').value.trim().split(' ')[0];
    $('ckDoneId').textContent='#'+(/^[0-9a-f]{8}-/i.test(res.orderId)?res.orderId.slice(0,8).toUpperCase():res.orderId);
    $('ckDone').hidden=false;$('backRow').style.display='none';window.scrollTo({top:0,behavior:'smooth'});
    location.href='/nf/';
  }
  function showFail(msg,title){
    state.idem=null;
    $('ckFailTitle').textContent=title||'Pagamento não aprovado';
    $('ckFailMsg').textContent=msg;$('ckFail').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
  }
  $('ckRetry').addEventListener('click',()=>{$('ckFail').hidden=true;$('ckMain').hidden=false;window.scrollTo({top:0,behavior:'smooth'});});

  function showPix(res){
    const pix=res.pix;
    $('ckPixCode').value=pix.copyPaste;$('ckPixValue').textContent=P.t1;
    const qr=$('ckQr');qr.innerHTML='';
    if(pix.qrImage){const i=document.createElement('img');i.alt='QR Code Pix';i.src=pix.qrImage.indexOf('data:')===0||/^https?:/.test(pix.qrImage)?pix.qrImage:'data:image/png;base64,'+pix.qrImage;qr.appendChild(i);}
    else if(window.QRCode){try{new QRCode(qr,{text:pix.copyPaste,width:196,height:196,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
    $('ckPix').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
    const exp=pix.expiresAt?new Date(pix.expiresAt).getTime():Date.now()+30*60000;
    let stopped=false;
    const tick=()=>{const s=Math.max(0,Math.round((exp-Date.now())/1000));$('ckTimer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
      if(s===0&&!stopped){stopped=true;clearInterval(cd);clearInterval(poll);showFail('O código Pix expirou. Gere um novo para concluir seu pedido.','Pix expirado');$('ckPix').hidden=true;$('ckMain').hidden=false;}};
    const cd=setInterval(tick,1000);tick();
    const poll=setInterval(async()=>{
      try{const s=await getStatus(res.orderId);
        if(s.status==='paid'){stopped=true;clearInterval(cd);clearInterval(poll);showDone(res);}
        else if(s.status==='refused'||s.status==='expired'||s.status==='canceled'){stopped=true;clearInterval(cd);clearInterval(poll);$('ckPix').hidden=true;showFail('O pagamento não foi concluído. Gere um novo Pix para tentar de novo.','Pagamento não concluído');$('ckMain').hidden=false;}
      }catch(e){}
    },C.pixPollMs);
  }
  $('ckCopy').addEventListener('click',async()=>{
    const t=$('ckPixCode').value,b=$('ckCopy');
    try{await navigator.clipboard.writeText(t);}catch(e){$('ckPixCode').select();document.execCommand('copy');}
    b.textContent='Código copiado ✓';setTimeout(()=>{b.textContent='Copiar código Pix';},2500);
  });

  showView('1');
}


(function(){
  const app=document.getElementById('app'), $t=id=>document.getElementById(id).textContent;
  const PRODUCTS=JSON.parse($t('data-products')), PRODTPL=$t('tpl-prod');
  const PAGES={home:{cls:'pg-home',title:$t('title-home'),html:$t('tpl-home'),js:JSON.parse($t('js-home'))},
               cat:{cls:'pg-cat',title:$t('title-cat'),html:$t('tpl-cat'),js:JSON.parse($t('js-cat'))}};
  let cur=null;
  const _si=window.setInterval,_st=window.setTimeout,_ae=window.addEventListener,_de=document.addEventListener;
  window.setInterval=function(){const id=_si.apply(window,arguments);cur&&cur.t.push(['i',id]);return id};
  window.setTimeout=function(){const id=_st.apply(window,arguments);cur&&cur.t.push(['t',id]);return id};
  window.addEventListener=function(t,f,o){cur&&cur.l.push([window,t,f,o]);return _ae.call(window,t,f,o)};
  document.addEventListener=function(t,f,o){cur&&cur.l.push([document,t,f,o]);return _de.call(document,t,f,o)};
  function unmount(){
    if(!cur)return;
    cur.t.forEach(x=>x[0]==='i'?clearInterval(x[1]):clearTimeout(x[1]));
    cur.l.forEach(x=>x[0].removeEventListener(x[1],x[2],x[3]));
    cur.g.forEach(n=>{try{delete window[n]}catch(e){}});
    cur=null;
  }
  function runJS(src,state){
    const names=[...src.matchAll(/^(?:async\s+)?function\s+(\w+)/gm)].map(m=>m[1]);
    names.forEach(n=>state.g.push(n));
    try{ new Function(src+'\n;'+names.map(n=>'window.'+n+'='+n).join(';'))(); }catch(e){console.error('[allu] erro no script da página:',e)}
  }
  function mount(kind,slug){
    unmount();
    const st={t:[],l:[],g:[]}; cur=st;
    document.body.className='r-'+kind;
    if(kind==='prod'){
      const P=PRODUCTS[slug];
      app.innerHTML='<div class="pg-prod">'+PRODTPL.replace('{{V2}}',()=>P.v2).replace('{{CONTRACT}}',()=>P.contract).replace('{{PRODLINE}}',()=>P.prodLine).replace('{{PLAN1}}',()=>P.plan1)+'</div>';
      document.title=P.title&&P.title.indexOf('Assine seu eletrônico')<0?P.title:('allu · '+P.name);
      try{mountProduct(P)}catch(e){console.error(e)}
    }else{
      const pg=PAGES[kind];
      app.innerHTML='<div class="'+pg.cls+'">'+pg.html+'</div>';
      document.title=pg.title;
      pg.js.forEach(s=>runJS(s,st));
    }
    window.scrollTo(0,0);
  }
  function route(){
    const p=location.hash.replace(/^#\/?/,'').split('/');
    if(p[0]==='catalogo')mount('cat');
    else if(p[0]==='produto'&&PRODUCTS[p[1]])mount('prod',p[1]);
    else mount('home');
  }
  _de.call(document,'click',e=>{const a=e.target.closest&&e.target.closest('a[href="#"]');if(a)e.preventDefault();});
  _ae.call(window,'hashchange',route);
  route();
})();

</script>
</body>
